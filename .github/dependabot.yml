version: 2
updates:
  # cooldown: wait 7 days before proposing a fresh release (gives the world time to spot a malicious one)
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    cooldown: { default-days: 7 }
